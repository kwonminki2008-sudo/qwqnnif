<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orc Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; background: #000; }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960"></canvas>

  <script>
    // ─── Tunable constants ──────────────────────────────────────────────────
    const GAME_WIDTH  = 540;
    const GAME_HEIGHT = 960;

    const ARENA_WIDTH   = 400;
    const ARENA_HEIGHT  = 560;
    const ARENA_X       = (GAME_WIDTH - ARENA_WIDTH) / 2;
    const ARENA_Y       = 118;

    const SPRITE_TARGET_HEIGHT   = 145;
    const VISUAL_WALL_PADDING_X  = 6;
    const VISUAL_WALL_PADDING_Y  = 8;
    const HITBOX_RADIUS          = 28;

    const MOVE_SPEED          = 235;
    const MIN_SPEED           = 200;
    const MAX_SPEED           = 250;
    const FRICTION            = 1;
    const COLLISION_BOUNCE    = 1.0;
    const KNOCKBACK_FORCE     = 150;
    const FACE_LOCK_TIME      = 0.5;
    const DAMAGE              = 8;
    const DAMAGE_COOLDOWN     = 0.6;
    const ATTACK_DISPLAY_TIME = 0.15;

    const MAX_HP             = 100;
    const WALK_BOB_AMPLITUDE = 3;
    const WALK_BOB_SPEED     = 10;
    const CLOSE_RANGE        = 95;

    const FIGHTER_A_NAME = 'GREEN ORC';
    const FIGHTER_B_NAME = 'ORANGE ORC';
    const HP_BAR_Y       = ARENA_Y + ARENA_HEIGHT + 28;
    // ──────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');

    const SPRITE_PATH = 'assets/sprites/orc/';

    const POSE = {
      idle:           (f) => `orc_${f}_idle.png`,
      walk:           (f) => `orc_${f}_walk.png`,
      weapon_ready:   (f) => `orc_${f}_weapon_ready.png`,
      kick_ready:     (f) => `orc_${f}_kick_ready.png`,
      attack_forward: (f) => `orc_${f}_attack_forward.png`,
      attack_up:      (f) => `orc_${f}_attack_up.png`,
      attack_diag_up: (f) => `orc_${f}_attack_diag_up.png`,
      kick_down:      (f) => `orc_${f}_kick_down.png`,
      kick_diag_down: (f) => `orc_${f}_kick_diag_down.png`,
      dead:           ()  => 'orc_dead.png'
    };

    const images = {};
    const missingSprites = [];

    function loadAllImages() {
      const names = [
        'orc_left_idle.png', 'orc_left_walk.png', 'orc_left_weapon_ready.png',
        'orc_left_kick_ready.png', 'orc_left_attack_forward.png',
        'orc_left_attack_up.png', 'orc_left_attack_diag_up.png',
        'orc_left_kick_down.png', 'orc_left_kick_diag_down.png',
        'orc_right_idle.png', 'orc_right_walk.png', 'orc_right_weapon_ready.png',
        'orc_right_kick_ready.png', 'orc_right_attack_forward.png',
        'orc_right_attack_up.png', 'orc_right_attack_diag_up.png',
        'orc_right_kick_down.png', 'orc_right_kick_diag_down.png',
        'orc_dead.png'
      ];
      let pending = names.length;
      function done() { if (--pending <= 0 && missingSprites.length) console.warn('Missing:', missingSprites); }
      for (const name of names) {
        const img = new Image();
        img.onload  = done;
        img.onerror = () => { img._failed = true; missingSprites.push(name); done(); };
        img.src = SPRITE_PATH + name;
        images[name] = img;
      }
    }

    function getImage(filename) {
      const img = images[filename];
      if (img && !img._failed && img.complete && img.naturalWidth > 0) return img;
      return null;
    }

    function getSpriteDrawSize(img) {
      const drawH = SPRITE_TARGET_HEIGHT;
      const drawW = (img.naturalWidth / img.naturalHeight) * drawH;
      return { drawW, drawH };
    }

    function getVisualHalfSize(img) {
      if (img) {
        const { drawW, drawH } = getSpriteDrawSize(img);
        return {
          halfW: drawW * 0.5 + VISUAL_WALL_PADDING_X,
          halfH: drawH * 0.5 + VISUAL_WALL_PADDING_Y
        };
      }
      return {
        halfW: HITBOX_RADIUS + VISUAL_WALL_PADDING_X,
        halfH: HITBOX_RADIUS + VISUAL_WALL_PADDING_Y
      };
    }

    function normalizeSpeed(vx, vy, target) {
      const s = Math.hypot(vx, vy);
      if (s < 1) {
        const a = Math.random() * Math.PI * 2;
        return { vx: Math.cos(a) * target, vy: Math.sin(a) * target };
      }
      const k = target / s;
      return { vx: vx * k, vy: vy * k };
    }

    function facingFromDx(dx) {
      return dx >= 0 ? 'right' : 'left';
    }

    class Orc {
      constructor(x, y, color, enemy) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.enemy = enemy;
        this.hp = MAX_HP;
        this.alive = true;
        this.facing = 'right';
        this.damageCooldown = 0;
        this.faceLockTime = 0;
        this.attackTimer = 0;
        this.attackPose = 'attack_forward';
        this.walkPhase = Math.random() * Math.PI * 2;
        this.spriteOffsetX = 0;
        this.spriteOffsetY = 0;
      }

      getFilename() {
        const pose = this.getPose();
        if (pose === 'dead') return POSE.dead();
        return POSE[pose](this.facing);
      }

      getCurrentImage() {
        return getImage(this.getFilename());
      }

      setFacingTowardEnemy() {
        const dx = this.enemy.x - this.x;
        if (Math.abs(dx) > 1) this.facing = facingFromDx(dx);
      }

      giveInitialVelocity() {
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * MOVE_SPEED;
        this.vy = Math.sin(angle) * MOVE_SPEED;
        this.facing = this.vx >= 0 ? 'right' : 'left';
      }

      enforceConstantSpeed() {
        let s = Math.hypot(this.vx, this.vy);
        if (s < MIN_SPEED) {
          const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
          this.vx = n.vx;
          this.vy = n.vy;
          return;
        }
        if (s > MAX_SPEED) {
          const k = MAX_SPEED / s;
          this.vx *= k;
          this.vy *= k;
        }
        const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
        this.vx = n.vx;
        this.vy = n.vy;
      }

      resolveVisualWallBounce() {
        const img = this.getCurrentImage();
        const { halfW, halfH } = getVisualHalfSize(img);
        const aLeft = ARENA_X;
        const aRight = ARENA_X + ARENA_WIDTH;
        const aTop = ARENA_Y;
        const aBottom = ARENA_Y + ARENA_HEIGHT;

        if (this.x - halfW < aLeft) {
          this.x = aLeft + halfW;
          this.vx = -Math.abs(this.vx);
        }
        if (this.x + halfW > aRight) {
          this.x = aRight - halfW;
          this.vx = Math.abs(this.vx);
        }
        if (this.y - halfH < aTop) {
          this.y = aTop + halfH;
          this.vy = -Math.abs(this.vy);
        }
        if (this.y + halfH > aBottom) {
          this.y = aBottom - halfH;
          this.vy = -Math.abs(this.vy);
        }
      }

      update(dt) {
        if (!this.alive) return;

        this.damageCooldown = Math.max(0, this.damageCooldown - dt);
        this.faceLockTime = Math.max(0, this.faceLockTime - dt);
        if (this.attackTimer > 0) this.attackTimer -= dt;

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.resolveVisualWallBounce();
        this.enforceConstantSpeed();

        if (this.faceLockTime <= 0 && this.attackTimer <= 0) {
          if (Math.abs(this.vx) > 8) {
            this.facing = this.vx > 0 ? 'right' : 'left';
          }
        }

        this.walkPhase += dt * WALK_BOB_SPEED;
      }

      getPose() {
        if (!this.alive) return 'dead';
        if (this.attackTimer > 0) return this.attackPose;

        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const dist = Math.hypot(edx, edy);

        if (dist < CLOSE_RANGE && this.enemy.alive) {
          if (edy > 20 && Math.abs(edx) < edy * 1.2) return 'kick_ready';
          return 'weapon_ready';
        }
        return 'walk';
      }

      setAttackPoseFromEnemy() {
        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const ax = Math.abs(edx);
        const ay = Math.abs(edy);

        if (edy > ay * 0.5 && edy > 10) {
          this.attackPose = ax > ay * 0.6 ? 'kick_diag_down' : 'kick_down';
        } else if (edy < -ay * 0.5 && edy < -10) {
          this.attackPose = ax > ay * 0.6 ? 'attack_diag_up' : 'attack_up';
        } else {
          this.attackPose = 'attack_forward';
        }
        this.attackTimer = ATTACK_DISPLAY_TIME;
      }

      lockFacingOnHit() {
        this.setFacingTowardEnemy();
        this.faceLockTime = FACE_LOCK_TIME;
      }

      takeDamage(amount) {
        if (!this.alive || this.damageCooldown > 0) return false;
        this.hp -= amount;
        this.damageCooldown = DAMAGE_COOLDOWN;
        if (this.hp <= 0) {
          this.hp = 0;
          this.alive = false;
          this.vx = 0;
          this.vy = 0;
        }
        return true;
      }

      draw() {
        const bob = (this.getPose() === 'walk' && this.alive)
          ? Math.sin(this.walkPhase) * WALK_BOB_AMPLITUDE : 0;
        const img = this.getCurrentImage();
        const cx = this.x + this.spriteOffsetX;
        const cy = this.y + bob + this.spriteOffsetY;

        if (img) {
          const { drawW, drawH } = getSpriteDrawSize(img);
          ctx.drawImage(img, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
        } else {
          ctx.save();
          ctx.fillStyle = this.alive ? this.color : '#555';
          ctx.beginPath();
          ctx.ellipse(cx, cy, HITBOX_RADIUS * 0.7, HITBOX_RADIUS, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function resolveBodyCollision(a, b) {
      if (!a.alive || !b.alive) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = HITBOX_RADIUS * 2;
      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relVn < 0) {
        const impulse = -relVn * COLLISION_BOUNCE;
        a.vx -= impulse * nx;
        a.vy -= impulse * ny;
        b.vx += impulse * nx;
        b.vy += impulse * ny;
      }

      a.vx -= nx * KNOCKBACK_FORCE;
      a.vy -= ny * KNOCKBACK_FORCE;
      b.vx += nx * KNOCKBACK_FORCE;
      b.vy += ny * KNOCKBACK_FORCE;

      const an = normalizeSpeed(a.vx, a.vy, MOVE_SPEED);
      const bn = normalizeSpeed(b.vx, b.vy, MOVE_SPEED);
      a.vx = an.vx; a.vy = an.vy;
      b.vx = bn.vx; b.vy = bn.vy;

      a.resolveVisualWallBounce();
      b.resolveVisualWallBounce();

      const aDamaged = a.takeDamage(DAMAGE);
      const bDamaged = b.takeDamage(DAMAGE);
      if (aDamaged || bDamaged) {
        a.lockFacingOnHit();
        b.lockFacingOnHit();
        a.setAttackPoseFromEnemy();
        b.setAttackPoseFromEnemy();
      }
    }

    function drawBottomHPBar(x, y, w, hp, color) {
      const h = 22;
      const pct = hp / MAX_HP;
      ctx.fillStyle = '#222';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w * pct, h);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(hp), x + w / 2, y + 16);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = '#bbb';
      ctx.fillText('DMG:' + DAMAGE, x + w / 2, y + h + 14);
    }

    function drawUI() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ORC BATTLE', GAME_WIDTH / 2, 48);

      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#4caf50';
      ctx.fillText(FIGHTER_A_NAME, 16, 88);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff8c42';
      ctx.fillText(FIGHTER_B_NAME, GAME_WIDTH - 16, 88);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('VS', GAME_WIDTH / 2, 88);

      ctx.fillStyle = '#f0f0ea';
      ctx.fillRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 5;
      ctx.strokeRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 2;
      ctx.strokeRect(ARENA_X + 3, ARENA_Y + 3, ARENA_WIDTH - 6, ARENA_HEIGHT - 6);

      const barW = 228;
      const gap = 12;
      const barX1 = (GAME_WIDTH - barW * 2 - gap) / 2;
      drawBottomHPBar(barX1, HP_BAR_Y, barW, orcA.hp, '#4caf50');
      drawBottomHPBar(barX1 + barW + gap, HP_BAR_Y, barW, orcB.hp, '#ff8c42');

      ctx.fillStyle = '#555';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press R to restart', GAME_WIDTH / 2, GAME_HEIGHT - 14);
    }

    let orcA, orcB;
    let lastTime = 0;

    function initGame() {
      const midY = ARENA_Y + ARENA_HEIGHT / 2;
      orcA = new Orc(ARENA_X + 90, midY, '#3d8b5e');
      orcB = new Orc(ARENA_X + ARENA_WIDTH - 90, midY, '#c45c26');
      orcA.enemy = orcB;
      orcB.enemy = orcA;
      orcA.giveInitialVelocity();
      orcB.giveInitialVelocity();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      orcA.update(dt);
      orcB.update(dt);
      resolveBodyCollision(orcA, orcB);

      drawUI();
      orcA.draw();
      orcB.draw();

      if (!orcA.alive || !orcB.alive) {
        const winner = orcA.alive ? FIGHTER_A_NAME + ' WINS!' :
                       orcB.alive ? FIGHTER_B_NAME + ' WINS!' : 'DRAW!';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, GAME_WIDTH / 2, ARENA_Y + ARENA_HEIGHT / 2);
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') initGame();
    });

    loadAllImages();
    initGame();
    requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
  </script>
</body>
</html>
