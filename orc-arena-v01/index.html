<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orc Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e0a16;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; background: #100b1c; }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960"></canvas>

  <script>
    // ─── Tunable constants ──────────────────────────────────────────────────
    const GAME_WIDTH  = 540;
    const GAME_HEIGHT = 960;

    const ARENA_VIEW_SIZE  = 500;
    const VIEW_LEFT        = (GAME_WIDTH - ARENA_VIEW_SIZE) / 2;
    const VIEW_TOP         = 108;
    const ARENA_VISUAL_EXTRA_Y = 18;

    const BASE_RENDER_HEIGHT   = 130;
    const HITBOX_RADIUS        = 32;

    const arenaTop         = 0;
    const arenaBottom      = ARENA_VIEW_SIZE;
    const visualArenaTop   = arenaTop - ARENA_VISUAL_EXTRA_Y;
    const visualArenaBottom = arenaBottom + ARENA_VISUAL_EXTRA_Y;
    const HP_BAR_OFFSET_Y  = HITBOX_RADIUS + 36;

    const UNIT_SPEED          = 220;
    const MIN_WALL_BOUNCE     = UNIT_SPEED * 0.55;
    const WALL_EPS            = 0.75;
    const FACE_LOCK_TIME      = 0.5;
    const DAMAGE              = 8;
    const DAMAGE_COOLDOWN     = 0.6;
    const ATTACK_DISPLAY_TIME = 0.15;

    const MAX_HP             = 100;
    const WALK_BOB_AMPLITUDE = 3;
    const WALK_BOB_SPEED     = 10;
    const CLOSE_RANGE        = 95;
    const READY_DISPLAY_TIME = 0.5;

    const CAMERA_PAN_STRENGTH = 0.08;
    const CAMERA_LERP         = 0.06;
    const MAX_CAMERA_PAN      = 18;
    const camera = { x: 0, y: 0, zoom: 1, shakeTime: 0, shakePower: 0, hitZoom: 0 };
    // ──────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');

    const SPRITE_PATH = 'assets/sprites/orc/';

    const SPRITE_SCALE_OVERRIDES = {
      'orc_left_attack_up.png': 1.14,
      'orc_right_attack_up.png': 1.14,
      'orc_left_attack_diag_up.png': 1.12,
      'orc_right_attack_diag_up.png': 1.12,
      'orc_left_kick_down.png': 1.15,
      'orc_right_kick_down.png': 1.15,
      'orc_left_kick_diag_down.png': 1.13,
      'orc_right_kick_diag_down.png': 1.13
    };

    const POSE = {
      idle:           (f) => `orc_${f}_idle.png`,
      walk:           (f) => `orc_${f}_walk.png`,
      weapon_ready:   (f) => `orc_${f}_weapon_ready.png`,
      kick_ready:     (f) => `orc_${f}_kick_ready.png`,
      attack_forward: (f) => `orc_${f}_attack_forward.png`,
      attack_up:      (f) => `orc_${f}_attack_up.png`,
      attack_diag_up: (f) => `orc_${f}_attack_diag_up.png`,
      kick_down:      (f) => `orc_${f}_kick_down.png`,
      kick_diag_down: (f) => `orc_${f}_kick_diag_down.png`,
      dead:           ()  => 'orc_dead.png'
    };

    const images = {};
    const spriteCropCache = {};
    let fixedSpriteScale = null;
    let fixedAnchorOffX = null;
    let fixedAnchorOffY = null;

    function cropTransparent(img) {
      const key = img.src;
      if (spriteCropCache[key]) return spriteCropCache[key];
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const fallback = { sx: 0, sy: 0, sw: w, sh: h, bodyCx: w / 2, bodyCy: h * 0.52, ok: false };
      try {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const cctx = c.getContext('2d');
        cctx.drawImage(img, 0, 0);
        const data = cctx.getImageData(0, 0, w, h).data;
        let minX = w, minY = h, maxX = 0, maxY = 0;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (data[(y * w + x) * 4 + 3] > 10) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < minX) { spriteCropCache[key] = fallback; return fallback; }
        const cw = maxX - minX + 1;
        const ch = maxY - minY + 1;
        if (cw < 1 || ch < 1) { spriteCropCache[key] = fallback; return fallback; }
        const crop = { sx: minX, sy: minY, sw: cw, sh: ch, bodyCx: minX + cw / 2, bodyCy: minY + ch * 0.52, ok: true };
        spriteCropCache[key] = crop;
        return crop;
      } catch (e) {
        spriteCropCache[key] = fallback;
        return fallback;
      }
    }

    function safeSize(n, fallback) {
      const fb = (typeof fallback === 'number' && isFinite(fallback) && fallback > 0) ? fallback : 1;
      return (typeof n === 'number' && isFinite(n) && n > 0) ? n : fb;
    }

    function getSpriteDrawInfo(img, filename) {
      ensureFixedScale();
      const crop = cropTransparent(img);
      const baseScale = safeSize(fixedSpriteScale, BASE_RENDER_HEIGHT / safeSize(crop.sh, img.naturalHeight));
      const scaleOverride = SPRITE_SCALE_OVERRIDES[filename] || 1;
      const scale = baseScale * scaleOverride;
      const drawW = safeSize(crop.sw * scale, img.naturalWidth * scale);
      const drawH = safeSize(crop.sh * scale, BASE_RENDER_HEIGHT);
      return {
        crop,
        scale,
        drawW,
        drawH,
        anchorOffX: safeSize(fixedAnchorOffX * scaleOverride, drawW / 2),
        anchorOffY: safeSize(fixedAnchorOffY * scaleOverride, drawH * 0.52),
        ok: crop.ok
      };
    }

    function ensureFixedScale() {
      if (fixedSpriteScale && isFinite(fixedSpriteScale) && fixedSpriteScale > 0) return;
      fixedSpriteScale = null;
      const base = getImage('orc_right_walk.png') || getImage('orc_left_walk.png');
      if (!base || base.naturalHeight < 1) return;
      const crop = cropTransparent(base);
      fixedSpriteScale = BASE_RENDER_HEIGHT / safeSize(crop.sh, base.naturalHeight);
      fixedAnchorOffX = (crop.bodyCx - crop.sx) * fixedSpriteScale;
      fixedAnchorOffY = (crop.bodyCy - crop.sy) * fixedSpriteScale;
    }

    function loadAllImages() {
      const names = [
        'orc_left_idle.png', 'orc_left_walk.png', 'orc_left_weapon_ready.png',
        'orc_left_kick_ready.png', 'orc_left_attack_forward.png',
        'orc_left_attack_up.png', 'orc_left_attack_diag_up.png',
        'orc_left_kick_down.png', 'orc_left_kick_diag_down.png',
        'orc_right_idle.png', 'orc_right_walk.png', 'orc_right_weapon_ready.png',
        'orc_right_kick_ready.png', 'orc_right_attack_forward.png',
        'orc_right_attack_up.png', 'orc_right_attack_diag_up.png',
        'orc_right_kick_down.png', 'orc_right_kick_diag_down.png',
        'orc_dead.png'
      ];
      for (const name of names) {
        const img = new Image();
        img.onerror = () => { img._failed = true; };
        img.src = SPRITE_PATH + name;
        images[name] = img;
      }
    }

    function getImage(filename) {
      const img = images[filename];
      if (img && !img._failed && img.complete && img.naturalWidth > 0) return img;
      return null;
    }

    function getSpriteDrawSize(img) {
      const info = getSpriteDrawInfo(img);
      return { drawW: info.drawW, drawH: info.drawH };
    }

    function normalizeSpeed(vx, vy, target) {
      const s = Math.hypot(vx, vy);
      if (s < 1) {
        const a = Math.random() * Math.PI * 2;
        return { vx: Math.cos(a) * target, vy: Math.sin(a) * target };
      }
      const k = target / s;
      return { vx: vx * k, vy: vy * k };
    }

    function arenaToScreen(ax, ay) {
      return { x: VIEW_LEFT + ax, y: VIEW_TOP + ay };
    }

    function safeCamera() {
      if (!Number.isFinite(camera.x)) camera.x = 0;
      if (!Number.isFinite(camera.y)) camera.y = 0;
      if (!Number.isFinite(camera.zoom) || camera.zoom <= 0) camera.zoom = 1;
      camera.x = Math.max(-MAX_CAMERA_PAN, Math.min(MAX_CAMERA_PAN, camera.x));
      camera.y = Math.max(-MAX_CAMERA_PAN, Math.min(MAX_CAMERA_PAN, camera.y));
      camera.zoom = Math.min(1.08, Math.max(1, camera.zoom));
    }

    function triggerHitCamera() {
      camera.shakeTime = 0.15;
      camera.shakePower = 4;
      camera.hitZoom = 0.05;
    }

    function triggerDeathCamera() {
      camera.shakeTime = 0.2;
      camera.shakePower = 6;
      camera.hitZoom = 0.08;
    }

    function updateCamera(dt, a, b) {
      const midX = (a.x + b.x) * 0.5;
      const midY = (a.y + b.y) * 0.5;
      const arenaMid = ARENA_VIEW_SIZE * 0.5;
      const targetPanX = Math.max(-MAX_CAMERA_PAN, Math.min(MAX_CAMERA_PAN, (midX - arenaMid) * CAMERA_PAN_STRENGTH));
      const targetPanY = Math.max(-MAX_CAMERA_PAN, Math.min(MAX_CAMERA_PAN, (midY - arenaMid) * CAMERA_PAN_STRENGTH));
      camera.x += (targetPanX - camera.x) * CAMERA_LERP;
      camera.y += (targetPanY - camera.y) * CAMERA_LERP;

      let targetZoom = 1.0;
      if (a.alive && b.alive) {
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        if (dist < CLOSE_RANGE) targetZoom = 1.0 + (1 - dist / CLOSE_RANGE) * 0.03;
      }
      targetZoom = Math.min(1.08, targetZoom + camera.hitZoom);
      camera.zoom += (targetZoom - camera.zoom) * 0.08;

      camera.hitZoom = Math.max(0, camera.hitZoom - dt * 0.35);
      camera.shakeTime = Math.max(0, camera.shakeTime - dt);
      safeCamera();
    }

    function applyCameraTransform() {
      const cx = VIEW_LEFT + ARENA_VIEW_SIZE / 2;
      const cy = VIEW_TOP + ARENA_VIEW_SIZE / 2;
      let shakeX = 0;
      let shakeY = 0;
      if (camera.shakeTime > 0) {
        const fade = camera.shakeTime / 0.2;
        const p = camera.shakePower * fade;
        shakeX = (Math.random() - 0.5) * 2 * p;
        shakeY = (Math.random() - 0.5) * 2 * p;
      }
      ctx.translate(cx, cy);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-cx + camera.x + shakeX, -cy + camera.y + shakeY);
    }

    function resetCamera() {
      camera.x = 0;
      camera.y = 0;
      camera.zoom = 1;
      camera.shakeTime = 0;
      camera.shakePower = 0;
      camera.hitZoom = 0;
    }

    function clampArena(v) {
      return Math.max(HITBOX_RADIUS, Math.min(ARENA_VIEW_SIZE - HITBOX_RADIUS, v));
    }

    class Orc {
      constructor(x, y, color, name, enemy) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.name = name;
        this.enemy = enemy;
        this.hp = MAX_HP;
        this.alive = true;
        this.facing = 'right';
        this.damageCooldown = 0;
        this.faceLockTime = 0;
        this.attackTimer = 0;
        this.attackPose = 'attack_forward';
        this.readyTimer = 0;
        this.readyPose = 'weapon_ready';
        this.inCloseRange = false;
        this.walkPhase = Math.random() * Math.PI * 2;
      }

      getFilename() {
        const pose = this.getPose();
        if (pose === 'dead') return POSE.dead();
        return POSE[pose](this.facing);
      }

      getCurrentImage() {
        return getImage(this.getFilename());
      }

      setFacingTowardEnemy() {
        const dx = this.enemy.x - this.x;
        if (Math.abs(dx) > 1) this.facing = dx >= 0 ? 'right' : 'left';
      }

      giveInitialVelocity() {
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * UNIT_SPEED;
        this.vy = Math.sin(angle) * UNIT_SPEED;
        this.facing = this.vx >= 0 ? 'right' : 'left';
      }

      enforceConstantSpeed() {
        const n = normalizeSpeed(this.vx, this.vy, UNIT_SPEED);
        this.vx = n.vx;
        this.vy = n.vy;
      }

      resolveWallBounce() {
        const r = HITBOX_RADIUS;
        const maxX = ARENA_VIEW_SIZE - r;
        const maxY = ARENA_VIEW_SIZE - r;

        if (this.x <= r) {
          this.x = r + WALL_EPS;
          if (this.vx < 0) this.vx = Math.max(Math.abs(this.vx), MIN_WALL_BOUNCE);
        }
        if (this.x >= maxX) {
          this.x = maxX - WALL_EPS;
          if (this.vx > 0) this.vx = -Math.max(Math.abs(this.vx), MIN_WALL_BOUNCE);
        }
        if (this.y <= r) {
          this.y = r + WALL_EPS;
          if (this.vy < 0) this.vy = Math.max(Math.abs(this.vy), MIN_WALL_BOUNCE);
        }
        if (this.y >= maxY) {
          this.y = maxY - WALL_EPS;
          if (this.vy > 0) this.vy = -Math.max(Math.abs(this.vy), MIN_WALL_BOUNCE);
        }
        this.enforceConstantSpeed();
      }

      applyAntiStuck() {
        this.x = clampArena(this.x);
        this.y = clampArena(this.y);
        const s = Math.hypot(this.vx, this.vy);
        if (!isFinite(this.vx) || !isFinite(this.vy) || s < 1) {
          const a = Math.random() * Math.PI * 2;
          this.vx = Math.cos(a) * UNIT_SPEED;
          this.vy = Math.sin(a) * UNIT_SPEED;
        }
        this.enforceConstantSpeed();
      }

      update(dt) {
        if (!this.alive) return;

        this.damageCooldown = Math.max(0, this.damageCooldown - dt);
        this.faceLockTime = Math.max(0, this.faceLockTime - dt);
        if (this.attackTimer > 0) this.attackTimer -= dt;
        if (this.readyTimer > 0) this.readyTimer -= dt;

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.resolveWallBounce();
        this.applyAntiStuck();

        if (this.faceLockTime > 0) {
          this.setFacingTowardEnemy();
        } else if (this.attackTimer <= 0 && Math.abs(this.vx) > 8) {
          this.facing = this.vx > 0 ? 'right' : 'left';
        }

        this.walkPhase += dt * WALK_BOB_SPEED;
      }

      getPose() {
        if (!this.alive) return 'dead';
        if (this.attackTimer > 0) return this.attackPose;

        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const dist = Math.hypot(edx, edy);
        const inRange = dist < CLOSE_RANGE && this.enemy.alive;

        if (inRange && !this.inCloseRange) {
          this.readyPose = (edy > 20 && Math.abs(edx) < edy * 1.2) ? 'kick_ready' : 'weapon_ready';
          this.readyTimer = READY_DISPLAY_TIME;
        }
        this.inCloseRange = inRange;

        if (this.readyTimer > 0) return this.readyPose;
        return 'walk';
      }

      setAttackPoseFromEnemy() {
        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const ax = Math.abs(edx);
        const ay = Math.abs(edy);

        if (edy > ay * 0.5 && edy > 10) {
          this.attackPose = ax > ay * 0.6 ? 'kick_diag_down' : 'kick_down';
        } else if (edy < -ay * 0.5 && edy < -10) {
          this.attackPose = ax > ay * 0.6 ? 'attack_diag_up' : 'attack_up';
        } else {
          this.attackPose = 'attack_forward';
        }
        this.attackTimer = ATTACK_DISPLAY_TIME;
      }

      lockFacingOnHit() {
        this.setFacingTowardEnemy();
        this.faceLockTime = FACE_LOCK_TIME;
      }

      takeDamage(amount) {
        if (!this.alive || this.damageCooldown > 0) return false;
        this.hp -= amount;
        this.damageCooldown = DAMAGE_COOLDOWN;
        if (this.hp <= 0) {
          this.hp = 0;
          this.alive = false;
          this.vx = 0;
          this.vy = 0;
        }
        return true;
      }

      drawSprite() {
        const center = arenaToScreen(this.x, this.y);
        const img = this.getCurrentImage();

        const filename = this.getFilename();
        const scaleOverride = SPRITE_SCALE_OVERRIDES[filename] || 1;

        if (img) {
          ensureFixedScale();
          const fbScale = BASE_RENDER_HEIGHT / safeSize(img.naturalHeight, 100);
          const scale = safeSize(fixedSpriteScale, fbScale) * scaleOverride;
          let drawW = safeSize(img.naturalWidth * scale, BASE_RENDER_HEIGHT);
          let drawH = safeSize(img.naturalHeight * scale, BASE_RENDER_HEIGHT);
          let drawX = center.x - drawW / 2;
          let drawY = center.y - drawH * 0.52;

          try {
            const info = getSpriteDrawInfo(img, filename);
            drawW = safeSize(info.drawW, drawW);
            drawH = safeSize(info.drawH, drawH);
            drawX = center.x - safeSize(info.anchorOffX, drawW / 2);
            drawY = center.y - safeSize(info.anchorOffY, drawH * 0.52);
            if (!isFinite(drawX)) drawX = center.x - drawW / 2;
            if (!isFinite(drawY)) drawY = center.y - drawH * 0.52;
            if (!Number.isFinite(drawX) || !Number.isFinite(drawY) || !Number.isFinite(drawW) || !Number.isFinite(drawH) || drawW <= 0 || drawH <= 0) {
              drawW = safeSize(img.naturalWidth * scale, BASE_RENDER_HEIGHT);
              drawH = safeSize(img.naturalHeight * scale, BASE_RENDER_HEIGHT);
              drawX = center.x - drawW / 2;
              drawY = center.y - drawH * 0.52;
              ctx.drawImage(img, drawX, drawY, drawW, drawH);
            } else if (info.ok && info.crop.sw > 0 && info.crop.sh > 0) {
              ctx.drawImage(
                img,
                info.crop.sx, info.crop.sy, info.crop.sw, info.crop.sh,
                drawX, drawY, drawW, drawH
              );
            } else {
              ctx.drawImage(img, drawX, drawY, drawW, drawH);
            }
          } catch (e) {
            drawW = safeSize(img.naturalWidth * scale, BASE_RENDER_HEIGHT);
            drawH = safeSize(img.naturalHeight * scale, BASE_RENDER_HEIGHT);
            drawX = center.x - drawW / 2;
            drawY = center.y - drawH * 0.52;
            ctx.drawImage(img, drawX, drawY, drawW, drawH);
          }
        } else {
          ctx.save();
          ctx.fillStyle = this.alive ? this.color : '#555';
          ctx.beginPath();
          ctx.ellipse(center.x, center.y, HITBOX_RADIUS * 0.7, HITBOX_RADIUS, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

      }

      drawHeadHPBar() {
        if (!this.alive) return;
        const barW = 52;
        const barH = 7;
        let hpX = this.x - barW / 2;
        let hpY = this.y - HP_BAR_OFFSET_Y;
        hpX = Math.max(4, Math.min(hpX, ARENA_VIEW_SIZE - barW - 4));
        hpY = Math.max(visualArenaTop + 6, hpY);
        const sx = VIEW_LEFT + hpX;
        const sy = VIEW_TOP + hpY;
        const pct = this.hp / MAX_HP;
        ctx.fillStyle = '#000';
        ctx.fillRect(sx, sy, barW, barH);
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(sx, sy, barW * pct, barH);
      }
    }

    function resolveBodyCollision(a, b) {
      if (!a.alive || !b.alive || a.hp <= 0 || b.hp <= 0) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = HITBOX_RADIUS * 2;
      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relVn < 0) {
        const v1n = a.vx * nx + a.vy * ny;
        const v2n = b.vx * nx + b.vy * ny;
        a.vx += (v2n - v1n) * nx;
        a.vy += (v2n - v1n) * ny;
        b.vx += (v1n - v2n) * nx;
        b.vy += (v1n - v2n) * ny;
      }

      const an = normalizeSpeed(a.vx, a.vy, UNIT_SPEED);
      const bn = normalizeSpeed(b.vx, b.vy, UNIT_SPEED);
      a.vx = an.vx; a.vy = an.vy;
      b.vx = bn.vx; b.vy = bn.vy;
      a.applyAntiStuck();
      b.applyAntiStuck();

      const aAliveBefore = a.alive;
      const bAliveBefore = b.alive;
      const aDamaged = a.takeDamage(DAMAGE);
      const bDamaged = b.takeDamage(DAMAGE);
      if (aDamaged || bDamaged) {
        a.lockFacingOnHit();
        b.lockFacingOnHit();
        a.setAttackPoseFromEnemy();
        b.setAttackPoseFromEnemy();
        triggerHitCamera();
      }
      if ((aAliveBefore && !a.alive) || (bAliveBefore && !b.alive)) triggerDeathCamera();
    }

    function drawBottomHPText(y) {
      ctx.fillStyle = '#f2ecff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Green Orc  ' + Math.ceil(orcA.hp) + ' / ' + MAX_HP, 24, y);
      ctx.textAlign = 'right';
      ctx.fillText('Orange Orc  ' + Math.ceil(orcB.hp) + ' / ' + MAX_HP, GAME_WIDTH - 24, y);
    }

    function drawCameraUI() {
      ctx.fillStyle = '#f2ecff';
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ORC BATTLE', GAME_WIDTH / 2, 46);

      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#c7b8e8';
      ctx.fillText('GREEN ORC', GAME_WIDTH / 2 - 72, 82);
      ctx.fillText('VS', GAME_WIDTH / 2, 82);
      ctx.fillText('ORANGE ORC', GAME_WIDTH / 2 + 72, 82);
    }

    function drawFixedUI() {
      ctx.fillStyle = '#151020';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = '#c7b8e8';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press R to restart', GAME_WIDTH / 2, GAME_HEIGHT - 12);
    }

    function drawArenaWorld() {
      const visTop = VIEW_TOP - ARENA_VISUAL_EXTRA_Y;
      const visH = ARENA_VIEW_SIZE + ARENA_VISUAL_EXTRA_Y * 2;
      const visBottom = VIEW_TOP + ARENA_VIEW_SIZE + ARENA_VISUAL_EXTRA_Y;

      ctx.save();
      applyCameraTransform();

      drawCameraUI();

      ctx.fillStyle = '#140f20';
      ctx.fillRect(0, visBottom, GAME_WIDTH, GAME_HEIGHT - visBottom);

      ctx.save();
      ctx.beginPath();
      ctx.rect(VIEW_LEFT, visTop, ARENA_VIEW_SIZE, visH);
      ctx.clip();

      ctx.fillStyle = '#2a2138';
      ctx.fillRect(VIEW_LEFT, visTop, ARENA_VIEW_SIZE, visH);

      const tile = 60;
      ctx.strokeStyle = 'rgba(190, 160, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= ARENA_VIEW_SIZE; x += tile) {
        const sx = VIEW_LEFT + x;
        ctx.beginPath();
        ctx.moveTo(sx, visTop);
        ctx.lineTo(sx, visTop + visH);
        ctx.stroke();
      }
      for (let y = -ARENA_VISUAL_EXTRA_Y; y <= ARENA_VIEW_SIZE + ARENA_VISUAL_EXTRA_Y; y += tile) {
        const sy = VIEW_TOP + y;
        ctx.beginPath();
        ctx.moveTo(VIEW_LEFT, sy);
        ctx.lineTo(VIEW_LEFT + ARENA_VIEW_SIZE, sy);
        ctx.stroke();
      }

      ctx.restore();

      orcA.drawSprite();
      orcB.drawSprite();

      orcA.drawHeadHPBar();
      orcB.drawHeadHPBar();

      ctx.strokeStyle = '#a98ee8';
      ctx.lineWidth = 5;
      ctx.strokeRect(VIEW_LEFT, visTop, ARENA_VIEW_SIZE, visH);
      ctx.strokeStyle = '#b89cff';
      ctx.lineWidth = 2;
      ctx.strokeRect(VIEW_LEFT + 3, visTop + 3, ARENA_VIEW_SIZE - 6, visH - 6);

      drawBottomHPText(VIEW_TOP + ARENA_VIEW_SIZE + 36);

      ctx.restore();
    }

    let orcA, orcB;
    let lastTime = 0;

    function initGame() {
      const mid = ARENA_VIEW_SIZE / 2;
      orcA = new Orc(mid - 100, mid, '#3d8b5e', 'Green Orc');
      orcB = new Orc(mid + 100, mid, '#c45c26', 'Orange Orc');
      orcA.enemy = orcB;
      orcB.enemy = orcA;
      orcA.giveInitialVelocity();
      orcB.giveInitialVelocity();
      resetCamera();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      orcA.update(dt);
      orcB.update(dt);
      resolveBodyCollision(orcA, orcB);
      updateCamera(dt, orcA, orcB);

      drawFixedUI();
      drawArenaWorld();

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') initGame();
    });

    loadAllImages();
    initGame();
    requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
  </script>
</body>
</html>
