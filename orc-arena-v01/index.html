<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orc Arena v01</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      border: 2px solid #444;
      background: #2d4a3e;
    }
    #hint {
      position: fixed;
      bottom: 12px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Press R to restart</div>

  <script>
    // ─── Tunable constants (edit these) ───────────────────────────────────
    const CANVAS_WIDTH  = 1280;
    const CANVAS_HEIGHT = 720;

    const SPRITE_WIDTH  = 96;
    const SPRITE_HEIGHT = 96;
    const HITBOX_RADIUS = 28;

    const CHASE_ACCEL         = 0;
    const INITIAL_SPEED       = 210;
    const MAX_SPEED           = 280;
    const FRICTION            = 0.998;
    const WALL_BOUNCE         = 0.92;
    const COLLISION_BOUNCE    = 1.2;
    const KNOCKBACK_FORCE     = 360;
    const FACE_LOCK_TIME      = 0.5;
    const DAMAGE              = 12;
    const DAMAGE_COOLDOWN     = 0.6;
    const ATTACK_DISPLAY_TIME = 0.15;
    const MIN_SPEED           = 45;
    const LOW_SPEED_NUDGE     = 35;

    const MAX_HP             = 100;
    const WALK_BOB_AMPLITUDE = 4;
    const WALK_BOB_SPEED     = 10;
    const CLOSE_RANGE        = 120;
    // ──────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');

    const SPRITE_NAMES = {
      left: [
        'orc_left_idle.png', 'orc_left_walk.png', 'orc_left_weapon_ready.png',
        'orc_left_kick_ready.png', 'orc_left_attack_forward.png',
        'orc_left_attack_up.png', 'orc_left_attack_diag_up.png',
        'orc_left_kick_down.png', 'orc_left_kick_diag_down.png'
      ],
      right: [
        'orc_right_idle.png', 'orc_right_walk.png', 'orc_right_weapon_ready.png',
        'orc_right_kick_ready.png', 'orc_right_attack_forward.png',
        'orc_right_attack_up.png', 'orc_right_attack_diag_up.png',
        'orc_right_kick_down.png', 'orc_right_kick_diag_down.png'
      ],
      dead: ['orc_dead.png']
    };

    const SPRITE_PATH = 'assets/sprites/orc/';

    const POSE = {
      idle:              (f) => `orc_${f}_idle.png`,
      walk:              (f) => `orc_${f}_walk.png`,
      weapon_ready:      (f) => `orc_${f}_weapon_ready.png`,
      kick_ready:        (f) => `orc_${f}_kick_ready.png`,
      attack_forward:    (f) => `orc_${f}_attack_forward.png`,
      attack_up:         (f) => `orc_${f}_attack_up.png`,
      attack_diag_up:    (f) => `orc_${f}_attack_diag_up.png`,
      kick_down:         (f) => `orc_${f}_kick_down.png`,
      kick_diag_down:    (f) => `orc_${f}_kick_diag_down.png`,
      dead:              ()  => 'orc_dead.png'
    };

    const images = {};
    const missingSprites = [];

    function loadAllImages() {
      const allNames = [
        ...SPRITE_NAMES.left,
        ...SPRITE_NAMES.right,
        ...SPRITE_NAMES.dead
      ];
      let pending = allNames.length;

      function done() {
        pending--;
        if (pending <= 0) {
          if (missingSprites.length) {
            console.warn('Missing sprites (' + missingSprites.length + '):', missingSprites);
          } else {
            console.log('All 19 sprites loaded from ' + SPRITE_PATH);
          }
        }
      }

      for (const name of allNames) {
        const img = new Image();
        img.onload  = done;
        img.onerror = () => { img._failed = true; missingSprites.push(name); done(); };
        img.src = SPRITE_PATH + name;
        images[name] = img;
      }
    }

    function drawMissingSpriteDebug() {
      if (!missingSprites.length) return;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(8, 8, 520, 18 + missingSprites.length * 14);
      ctx.fillStyle = '#ff6b6b';
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText('Missing sprites (' + missingSprites.length + '):', 14, 22);
      missingSprites.forEach((name, i) => {
        ctx.fillText(name, 14, 36 + i * 14);
      });
    }

    function getImage(filename) {
      const img = images[filename];
      if (img && !img._failed && img.complete && img.naturalWidth > 0) return img;
      return null;
    }

    function clampSpeed(vx, vy, max) {
      const s = Math.hypot(vx, vy);
      if (s <= max) return { vx, vy };
      const k = max / s;
      return { vx: vx * k, vy: vy * k };
    }

    function facingFromDx(dx) {
      return dx >= 0 ? 'right' : 'left';
    }

    class Orc {
      constructor(x, y, color, enemy) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.enemy = enemy;
        this.hp = MAX_HP;
        this.alive = true;
        this.facing = 'right';
        this.damageCooldown = 0;
        this.faceLockTime = 0;
        this.attackTimer = 0;
        this.attackPose = 'attack_forward';
        this.walkPhase = Math.random() * Math.PI * 2;
        this.moving = false;
      }

      setFacingTowardEnemy() {
        const dx = this.enemy.x - this.x;
        if (Math.abs(dx) > 1) this.facing = facingFromDx(dx);
      }

      giveInitialVelocity() {
        const dx = this.enemy.x - this.x;
        const dy = this.enemy.y - this.y;
        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.6;
        this.vx = Math.cos(angle) * INITIAL_SPEED;
        this.vy = Math.sin(angle) * INITIAL_SPEED;
        this.setFacingTowardEnemy();
      }

      update(dt) {
        if (!this.alive) return;

        this.damageCooldown = Math.max(0, this.damageCooldown - dt);
        this.faceLockTime = Math.max(0, this.faceLockTime - dt);
        if (this.attackTimer > 0) this.attackTimer -= dt;

        // Optional weak chase (disabled when CHASE_ACCEL = 0)
        if (CHASE_ACCEL > 0) {
          const dx = this.enemy.x - this.x;
          const dy = this.enemy.y - this.y;
          const dist = Math.hypot(dx, dy) || 1;
          this.vx += (dx / dist) * CHASE_ACCEL * dt;
          this.vy += (dy / dist) * CHASE_ACCEL * dt;
        }

        // Very light friction
        const drag = Math.pow(FRICTION, dt * 60);
        this.vx *= drag;
        this.vy *= drag;

        // Tiny nudge if nearly stopped
        let speed = Math.hypot(this.vx, this.vy);
        if (speed < MIN_SPEED) {
          if (speed < 1) {
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * MIN_SPEED;
            this.vy = Math.sin(angle) * MIN_SPEED;
          } else {
            this.vx += (Math.random() - 0.5) * LOW_SPEED_NUDGE * dt;
            this.vy += (Math.random() - 0.5) * LOW_SPEED_NUDGE * dt;
          }
        }

        const capped = clampSpeed(this.vx, this.vy, MAX_SPEED);
        this.vx = capped.vx;
        this.vy = capped.vy;

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Wall bounce (velocity reflection)
        const r = HITBOX_RADIUS;
        if (this.x - r < 0) {
          this.x = r;
          this.vx = -this.vx * WALL_BOUNCE;
        }
        if (this.x + r > CANVAS_WIDTH) {
          this.x = CANVAS_WIDTH - r;
          this.vx = -this.vx * WALL_BOUNCE;
        }
        if (this.y - r < 0) {
          this.y = r;
          this.vy = -this.vy * WALL_BOUNCE;
        }
        if (this.y + r > CANVAS_HEIGHT) {
          this.y = CANVAS_HEIGHT - r;
          this.vy = -this.vy * WALL_BOUNCE;
        }

        // Facing follows velocity only when not locked / attacking
        if (this.faceLockTime <= 0 && this.attackTimer <= 0) {
          if (Math.abs(this.vx) > 8) {
            this.facing = this.vx > 0 ? 'right' : 'left';
          }
        }

        speed = Math.hypot(this.vx, this.vy);
        this.moving = speed > 12;
        if (this.moving) this.walkPhase += dt * WALK_BOB_SPEED;
      }

      getPose() {
        if (!this.alive) return 'dead';
        if (this.attackTimer > 0) return this.attackPose;

        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const dist = Math.hypot(edx, edy);

        if (dist < CLOSE_RANGE && this.enemy.alive) {
          if (edy > 20 && Math.abs(edx) < edy * 1.2) return 'kick_ready';
          return 'weapon_ready';
        }

        return this.moving ? 'walk' : 'idle';
      }

      getFilename() {
        const pose = this.getPose();
        if (pose === 'dead') return POSE.dead();
        return POSE[pose](this.facing);
      }

      setAttackPoseFromEnemy() {
        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const ax = Math.abs(edx);
        const ay = Math.abs(edy);

        if (edy > ay * 0.5 && edy > 10) {
          this.attackPose = ax > ay * 0.6 ? 'kick_diag_down' : 'kick_down';
        } else if (edy < -ay * 0.5 && edy < -10) {
          this.attackPose = ax > ay * 0.6 ? 'attack_diag_up' : 'attack_up';
        } else {
          this.attackPose = 'attack_forward';
        }
        this.attackTimer = ATTACK_DISPLAY_TIME;
      }

      lockFacingOnHit() {
        this.setFacingTowardEnemy();
        this.faceLockTime = FACE_LOCK_TIME;
      }

      takeDamage(amount) {
        if (!this.alive || this.damageCooldown > 0) return false;
        this.hp -= amount;
        this.damageCooldown = DAMAGE_COOLDOWN;
        if (this.hp <= 0) {
          this.hp = 0;
          this.alive = false;
          this.vx = 0;
          this.vy = 0;
        }
        return true;
      }

      draw() {
        const bob = (this.getPose() === 'walk' && this.alive)
          ? Math.sin(this.walkPhase) * WALK_BOB_AMPLITUDE
          : 0;

        const drawY = this.y + bob;
        const filename = this.getFilename();
        const img = getImage(filename);

        if (img) {
          ctx.drawImage(
            img,
            this.x - SPRITE_WIDTH / 2,
            drawY - SPRITE_HEIGHT / 2,
            SPRITE_WIDTH,
            SPRITE_HEIGHT
          );
        } else {
          drawFallbackCapsule(this.x, drawY, this.color, this.alive);
        }

        if (this.alive) drawHPBar(this.x, drawY - SPRITE_HEIGHT / 2 - 14, this.hp);
      }
    }

    function drawFallbackCapsule(x, y, color, alive) {
      ctx.save();
      ctx.fillStyle = alive ? color : '#555';
      ctx.beginPath();
      ctx.ellipse(x, y, HITBOX_RADIUS * 0.7, HITBOX_RADIUS, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawHPBar(x, y, hp) {
      const w = 60, h = 8;
      const pct = hp / MAX_HP;
      ctx.fillStyle = '#333';
      ctx.fillRect(x - w / 2, y, w, h);
      ctx.fillStyle = pct > 0.3 ? '#4caf50' : '#f44336';
      ctx.fillRect(x - w / 2, y, w * pct, h);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1;
      ctx.strokeRect(x - w / 2, y, w, h);
    }

    function resolveBodyCollision(a, b) {
      if (!a.alive || !b.alive) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = HITBOX_RADIUS * 2;

      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relVn < 0) {
        const impulse = -relVn * COLLISION_BOUNCE;
        a.vx -= impulse * nx;
        a.vy -= impulse * ny;
        b.vx += impulse * nx;
        b.vy += impulse * ny;
      }

      a.vx -= nx * KNOCKBACK_FORCE;
      a.vy -= ny * KNOCKBACK_FORCE;
      b.vx += nx * KNOCKBACK_FORCE;
      b.vy += ny * KNOCKBACK_FORCE;

      const aCapped = clampSpeed(a.vx, a.vy, MAX_SPEED * 1.5);
      const bCapped = clampSpeed(b.vx, b.vy, MAX_SPEED * 1.5);
      a.vx = aCapped.vx;
      a.vy = aCapped.vy;
      b.vx = bCapped.vx;
      b.vy = bCapped.vy;

      const aDamaged = a.takeDamage(DAMAGE);
      const bDamaged = b.takeDamage(DAMAGE);
      if (aDamaged || bDamaged) {
        a.lockFacingOnHit();
        b.lockFacingOnHit();
        a.setAttackPoseFromEnemy();
        b.setAttackPoseFromEnemy();
      }
    }

    let orcA, orcB;
    let lastTime = 0;

    function initGame() {
      orcB = new Orc(CANVAS_WIDTH - 180, CANVAS_HEIGHT / 2, '#c45c26');
      orcA = new Orc(180, CANVAS_HEIGHT / 2, '#3d8b5e');
      orcA.enemy = orcB;
      orcB.enemy = orcA;
      orcA.giveInitialVelocity();
      orcB.giveInitialVelocity();
    }

    function drawArena() {
      ctx.fillStyle = '#2d4a3e';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.strokeStyle = '#5a7a62';
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, CANVAS_WIDTH - 4, CANVAS_HEIGHT - 4);
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      orcA.update(dt);
      orcB.update(dt);
      resolveBodyCollision(orcA, orcB);

      drawArena();
      orcA.draw();
      orcB.draw();
      drawMissingSpriteDebug();

      if (!orcA.alive || !orcB.alive) {
        const winner = orcA.alive ? 'Green Orc wins!' : orcB.alive ? 'Orange Orc wins!' : 'Draw!';
        if (!orcA.alive && !orcB.alive) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2);
        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press R to restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 40);
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') initGame();
    });

    loadAllImages();
    initGame();
    requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
  </script>
</body>
</html>
