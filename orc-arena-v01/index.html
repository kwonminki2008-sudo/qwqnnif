<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orc Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; background: #000; }
  </style>
</head>
<body>
  <canvas id="game" width="540" height="960"></canvas>

  <script>
    // ─── Tunable constants ──────────────────────────────────────────────────
    const GAME_WIDTH  = 540;
    const GAME_HEIGHT = 960;

    const ARENA_WORLD_SIZE = 900;
    const ARENA_VIEW_SIZE  = 500;
    const VIEW_LEFT        = (GAME_WIDTH - ARENA_VIEW_SIZE) / 2;
    const VIEW_TOP         = 108;

    const SPRITE_TARGET_HEIGHT = 150;
    const HITBOX_RADIUS        = 28;

    const MOVE_SPEED          = 235;
    const MIN_SPEED           = 200;
    const MAX_SPEED           = 250;
    const COLLISION_BOUNCE    = 1.0;
    const KNOCKBACK_FORCE     = 150;
    const CAMERA_LERP         = 0.08;
    const FACE_LOCK_TIME      = 0.5;
    const DAMAGE              = 8;
    const DAMAGE_COOLDOWN     = 0.6;
    const ATTACK_DISPLAY_TIME = 0.15;

    const MAX_HP             = 100;
    const WALK_BOB_AMPLITUDE = 3;
    const WALK_BOB_SPEED     = 10;
    const CLOSE_RANGE        = 95;

    const WORLD_CENTER = ARENA_WORLD_SIZE / 2;
    // ──────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');

    const SPRITE_PATH = 'assets/sprites/orc/';

    const POSE = {
      idle:           (f) => `orc_${f}_idle.png`,
      walk:           (f) => `orc_${f}_walk.png`,
      weapon_ready:   (f) => `orc_${f}_weapon_ready.png`,
      kick_ready:     (f) => `orc_${f}_kick_ready.png`,
      attack_forward: (f) => `orc_${f}_attack_forward.png`,
      attack_up:      (f) => `orc_${f}_attack_up.png`,
      attack_diag_up: (f) => `orc_${f}_attack_diag_up.png`,
      kick_down:      (f) => `orc_${f}_kick_down.png`,
      kick_diag_down: (f) => `orc_${f}_kick_diag_down.png`,
      dead:           ()  => 'orc_dead.png'
    };

    const images = {};
    const camera = { x: 0, y: 0 };

    function loadAllImages() {
      const names = [
        'orc_left_idle.png', 'orc_left_walk.png', 'orc_left_weapon_ready.png',
        'orc_left_kick_ready.png', 'orc_left_attack_forward.png',
        'orc_left_attack_up.png', 'orc_left_attack_diag_up.png',
        'orc_left_kick_down.png', 'orc_left_kick_diag_down.png',
        'orc_right_idle.png', 'orc_right_walk.png', 'orc_right_weapon_ready.png',
        'orc_right_kick_ready.png', 'orc_right_attack_forward.png',
        'orc_right_attack_up.png', 'orc_right_attack_diag_up.png',
        'orc_right_kick_down.png', 'orc_right_kick_diag_down.png',
        'orc_dead.png'
      ];
      for (const name of names) {
        const img = new Image();
        img.onerror = () => { img._failed = true; };
        img.src = SPRITE_PATH + name;
        images[name] = img;
      }
    }

    function getImage(filename) {
      const img = images[filename];
      if (img && !img._failed && img.complete && img.naturalWidth > 0) return img;
      return null;
    }

    function getSpriteDrawSize(img) {
      const drawH = SPRITE_TARGET_HEIGHT;
      const drawW = (img.naturalWidth / img.naturalHeight) * drawH;
      return { drawW, drawH };
    }

    function normalizeSpeed(vx, vy, target) {
      const s = Math.hypot(vx, vy);
      if (s < 1) {
        const a = Math.random() * Math.PI * 2;
        return { vx: Math.cos(a) * target, vy: Math.sin(a) * target };
      }
      const k = target / s;
      return { vx: vx * k, vy: vy * k };
    }

    function worldToScreen(wx, wy) {
      return {
        x: wx - camera.x + VIEW_LEFT,
        y: wy - camera.y + VIEW_TOP
      };
    }

    function clampCamera(x, y) {
      const max = ARENA_WORLD_SIZE - ARENA_VIEW_SIZE;
      return {
        x: Math.max(0, Math.min(max, x)),
        y: Math.max(0, Math.min(max, y))
      };
    }

    function updateCamera() {
      const centerCam = clampCamera(WORLD_CENTER - ARENA_VIEW_SIZE / 2, WORLD_CENTER - ARENA_VIEW_SIZE / 2);
      let targetX = centerCam.x;
      let targetY = centerCam.y;

      const alive = [];
      if (orcA.alive) alive.push(orcA);
      if (orcB.alive) alive.push(orcB);

      if (alive.length === 1) {
        const f = alive[0];
        const c = clampCamera(f.x - ARENA_VIEW_SIZE / 2, f.y - ARENA_VIEW_SIZE / 2);
        targetX = c.x;
        targetY = c.y;
      } else if (alive.length === 2) {
        const distA = Math.hypot(orcA.x - WORLD_CENTER, orcA.y - WORLD_CENTER);
        const distB = Math.hypot(orcB.x - WORLD_CENTER, orcB.y - WORLD_CENTER);
        const focus = distA >= distB ? orcA : orcB;
        const c = clampCamera(focus.x - ARENA_VIEW_SIZE / 2, focus.y - ARENA_VIEW_SIZE / 2);
        targetX = c.x;
        targetY = c.y;

        const nearCenter = Math.min(distA, distB);
        if (nearCenter < 130) {
          const blend = 1 - nearCenter / 130;
          targetX = targetX * (1 - blend) + centerCam.x * blend;
          targetY = targetY * (1 - blend) + centerCam.y * blend;
          const clamped = clampCamera(targetX, targetY);
          targetX = clamped.x;
          targetY = clamped.y;
        }
      }

      camera.x += (targetX - camera.x) * CAMERA_LERP;
      camera.y += (targetY - camera.y) * CAMERA_LERP;
    }

    class Orc {
      constructor(x, y, color, hpColor, enemy) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.hpColor = hpColor;
        this.enemy = enemy;
        this.hp = MAX_HP;
        this.alive = true;
        this.facing = 'right';
        this.damageCooldown = 0;
        this.faceLockTime = 0;
        this.attackTimer = 0;
        this.attackPose = 'attack_forward';
        this.walkPhase = Math.random() * Math.PI * 2;
      }

      getFilename() {
        const pose = this.getPose();
        if (pose === 'dead') return POSE.dead();
        return POSE[pose](this.facing);
      }

      getCurrentImage() {
        return getImage(this.getFilename());
      }

      setFacingTowardEnemy() {
        const dx = this.enemy.x - this.x;
        if (Math.abs(dx) > 1) this.facing = dx >= 0 ? 'right' : 'left';
      }

      giveInitialVelocity() {
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * MOVE_SPEED;
        this.vy = Math.sin(angle) * MOVE_SPEED;
        this.facing = this.vx >= 0 ? 'right' : 'left';
      }

      enforceConstantSpeed() {
        let s = Math.hypot(this.vx, this.vy);
        if (s < MIN_SPEED) {
          const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
          this.vx = n.vx;
          this.vy = n.vy;
          return;
        }
        if (s > MAX_SPEED) {
          const k = MAX_SPEED / s;
          this.vx *= k;
          this.vy *= k;
        }
        const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
        this.vx = n.vx;
        this.vy = n.vy;
      }

      resolveWallBounce() {
        const r = HITBOX_RADIUS;
        if (this.x - r < 0) { this.x = r; this.vx = -Math.abs(this.vx); }
        if (this.x + r > ARENA_WORLD_SIZE) { this.x = ARENA_WORLD_SIZE - r; this.vx = Math.abs(this.vx); }
        if (this.y - r < 0) { this.y = r; this.vy = -Math.abs(this.vy); }
        if (this.y + r > ARENA_WORLD_SIZE) { this.y = ARENA_WORLD_SIZE - r; this.vy = Math.abs(this.vy); }
      }

      update(dt) {
        if (!this.alive) return;

        this.damageCooldown = Math.max(0, this.damageCooldown - dt);
        this.faceLockTime = Math.max(0, this.faceLockTime - dt);
        if (this.attackTimer > 0) this.attackTimer -= dt;

        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.resolveWallBounce();
        this.enforceConstantSpeed();

        if (this.faceLockTime <= 0 && this.attackTimer <= 0) {
          if (Math.abs(this.vx) > 8) this.facing = this.vx > 0 ? 'right' : 'left';
        }

        this.walkPhase += dt * WALK_BOB_SPEED;
      }

      getPose() {
        if (!this.alive) return 'dead';
        if (this.attackTimer > 0) return this.attackPose;

        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const dist = Math.hypot(edx, edy);

        if (dist < CLOSE_RANGE && this.enemy.alive) {
          if (edy > 20 && Math.abs(edx) < edy * 1.2) return 'kick_ready';
          return 'weapon_ready';
        }
        return 'walk';
      }

      setAttackPoseFromEnemy() {
        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const ax = Math.abs(edx);
        const ay = Math.abs(edy);

        if (edy > ay * 0.5 && edy > 10) {
          this.attackPose = ax > ay * 0.6 ? 'kick_diag_down' : 'kick_down';
        } else if (edy < -ay * 0.5 && edy < -10) {
          this.attackPose = ax > ay * 0.6 ? 'attack_diag_up' : 'attack_up';
        } else {
          this.attackPose = 'attack_forward';
        }
        this.attackTimer = ATTACK_DISPLAY_TIME;
      }

      lockFacingOnHit() {
        this.setFacingTowardEnemy();
        this.faceLockTime = FACE_LOCK_TIME;
      }

      takeDamage(amount) {
        if (!this.alive || this.damageCooldown > 0) return false;
        this.hp -= amount;
        this.damageCooldown = DAMAGE_COOLDOWN;
        if (this.hp <= 0) {
          this.hp = 0;
          this.alive = false;
          this.vx = 0;
          this.vy = 0;
        }
        return true;
      }

      drawSprite() {
        const bob = (this.getPose() === 'walk' && this.alive)
          ? Math.sin(this.walkPhase) * WALK_BOB_AMPLITUDE : 0;
        const screen = worldToScreen(this.x, this.y + bob);
        const img = this.getCurrentImage();
        let drawH = SPRITE_TARGET_HEIGHT;

        if (img) {
          const { drawW, drawH: dh } = getSpriteDrawSize(img);
          drawH = dh;
          ctx.drawImage(img, screen.x - drawW / 2, screen.y - drawH / 2, drawW, drawH);
        } else {
          ctx.save();
          ctx.fillStyle = this.alive ? this.color : '#555';
          ctx.beginPath();
          ctx.ellipse(screen.x, screen.y, HITBOX_RADIUS * 0.7, HITBOX_RADIUS, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        return { screenX: screen.x, screenY: screen.y, drawH };
      }

      drawHPBar(screenX, screenY, drawH) {
        if (!this.alive) return;
        const w = 58;
        const h = 9;
        const barY = screenY - drawH / 2 - 16;
        const pct = this.hp / MAX_HP;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(screenX - w / 2 - 1, barY - 13, w + 2, h + 14);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(screenX - w / 2, barY, w, h);
        ctx.fillStyle = this.hpColor;
        ctx.fillRect(screenX - w / 2, barY, w * pct, h);
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.strokeRect(screenX - w / 2, barY, w, h);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(this.hp) + '/' + MAX_HP, screenX, barY - 3);
      }
    }

    function resolveBodyCollision(a, b) {
      if (!a.alive || !b.alive) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = HITBOX_RADIUS * 2;
      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relVn < 0) {
        const impulse = -relVn * COLLISION_BOUNCE;
        a.vx -= impulse * nx;
        a.vy -= impulse * ny;
        b.vx += impulse * nx;
        b.vy += impulse * ny;
      }

      a.vx -= nx * KNOCKBACK_FORCE;
      a.vy -= ny * KNOCKBACK_FORCE;
      b.vx += nx * KNOCKBACK_FORCE;
      b.vy += ny * KNOCKBACK_FORCE;

      const an = normalizeSpeed(a.vx, a.vy, MOVE_SPEED);
      const bn = normalizeSpeed(b.vx, b.vy, MOVE_SPEED);
      a.vx = an.vx; a.vy = an.vy;
      b.vx = bn.vx; b.vy = bn.vy;

      const aDamaged = a.takeDamage(DAMAGE);
      const bDamaged = b.takeDamage(DAMAGE);
      if (aDamaged || bDamaged) {
        a.lockFacingOnHit();
        b.lockFacingOnHit();
        a.setAttackPoseFromEnemy();
        b.setAttackPoseFromEnemy();
      }
    }

    function drawFixedUI() {
      ctx.fillStyle = '#08080c';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      ctx.fillStyle = '#e8e0d0';
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ORC BATTLE', GAME_WIDTH / 2, 46);

      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#6ecf6e';
      ctx.fillText('GREEN ORC', GAME_WIDTH / 2 - 72, 82);
      ctx.fillStyle = '#ccc';
      ctx.fillText('VS', GAME_WIDTH / 2, 82);
      ctx.fillStyle = '#e8944a';
      ctx.fillText('ORANGE ORC', GAME_WIDTH / 2 + 72, 82);

      ctx.fillStyle = '#444';
      ctx.font = '11px sans-serif';
      ctx.fillText('Press R to restart', GAME_WIDTH / 2, GAME_HEIGHT - 12);
    }

    function drawArenaWorld() {
      ctx.save();
      ctx.beginPath();
      ctx.rect(VIEW_LEFT, VIEW_TOP, ARENA_VIEW_SIZE, ARENA_VIEW_SIZE);
      ctx.clip();

      const wx = camera.x;
      const wy = camera.y;

      ctx.fillStyle = '#1e1828';
      ctx.fillRect(VIEW_LEFT, VIEW_TOP, ARENA_VIEW_SIZE, ARENA_VIEW_SIZE);

      ctx.fillStyle = '#2a2236';
      ctx.fillRect(VIEW_LEFT - wx, VIEW_TOP - wy, ARENA_WORLD_SIZE, ARENA_WORLD_SIZE);

      ctx.strokeStyle = '#4a3d5c';
      ctx.lineWidth = 3;
      ctx.strokeRect(VIEW_LEFT - wx, VIEW_TOP - wy, ARENA_WORLD_SIZE, ARENA_WORLD_SIZE);

      const tile = 60;
      ctx.strokeStyle = 'rgba(90,70,110,0.25)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= ARENA_WORLD_SIZE; x += tile) {
        const sx = VIEW_LEFT + x - wx;
        ctx.beginPath();
        ctx.moveTo(sx, VIEW_TOP);
        ctx.lineTo(sx, VIEW_TOP + ARENA_VIEW_SIZE);
        ctx.stroke();
      }
      for (let y = 0; y <= ARENA_WORLD_SIZE; y += tile) {
        const sy = VIEW_TOP + y - wy;
        ctx.beginPath();
        ctx.moveTo(VIEW_LEFT, sy);
        ctx.lineTo(VIEW_LEFT + ARENA_VIEW_SIZE, sy);
        ctx.stroke();
      }

      const infoA = orcA.drawSprite();
      const infoB = orcB.drawSprite();
      orcA.drawHPBar(infoA.screenX, infoA.screenY, infoA.drawH);
      orcB.drawHPBar(infoB.screenX, infoB.screenY, infoB.drawH);

      ctx.restore();

      ctx.strokeStyle = '#7a6490';
      ctx.lineWidth = 5;
      ctx.strokeRect(VIEW_LEFT, VIEW_TOP, ARENA_VIEW_SIZE, ARENA_VIEW_SIZE);
      ctx.strokeStyle = '#c8b8d8';
      ctx.lineWidth = 2;
      ctx.strokeRect(VIEW_LEFT + 3, VIEW_TOP + 3, ARENA_VIEW_SIZE - 6, ARENA_VIEW_SIZE - 6);
    }

    let orcA, orcB;
    let lastTime = 0;

    function initGame() {
      orcA = new Orc(WORLD_CENTER - 120, WORLD_CENTER, '#3d8b5e', '#4caf50');
      orcB = new Orc(WORLD_CENTER + 120, WORLD_CENTER, '#c45c26', '#e8944a');
      orcA.enemy = orcB;
      orcB.enemy = orcA;
      orcA.giveInitialVelocity();
      orcB.giveInitialVelocity();
      camera.x = WORLD_CENTER - ARENA_VIEW_SIZE / 2;
      camera.y = WORLD_CENTER - ARENA_VIEW_SIZE / 2;
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      orcA.update(dt);
      orcB.update(dt);
      resolveBodyCollision(orcA, orcB);
      updateCamera();

      drawFixedUI();
      drawArenaWorld();

      if (!orcA.alive || !orcB.alive) {
        const winner = orcA.alive ? 'GREEN ORC WINS!' :
                       orcB.alive ? 'ORANGE ORC WINS!' : 'DRAW!';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(VIEW_LEFT, VIEW_TOP, ARENA_VIEW_SIZE, ARENA_VIEW_SIZE);
        ctx.fillStyle = '#f0e8d8';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, GAME_WIDTH / 2, VIEW_TOP + ARENA_VIEW_SIZE / 2);
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') initGame();
    });

    loadAllImages();
    initGame();
    requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
  </script>
</body>
</html>
