<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orc Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { display: block; background: #000; }
  </style>
</head>
<body>
  <canvas id="game" width="720" height="1280"></canvas>

  <script>
    // ─── Tunable constants ──────────────────────────────────────────────────
    const CANVAS_WIDTH  = 720;
    const CANVAS_HEIGHT = 1280;

    const ARENA_WIDTH   = 420;
    const ARENA_HEIGHT  = 560;
    const UI_TOP        = 130;
    const UI_BOTTOM     = 170;
    const ARENA_X       = (CANVAS_WIDTH - ARENA_WIDTH) / 2;
    const ARENA_Y       = UI_TOP + Math.floor((CANVAS_HEIGHT - UI_TOP - UI_BOTTOM - ARENA_HEIGHT) / 2);

    const SPRITE_WIDTH  = 110;
    const SPRITE_HEIGHT = 140;
    const HITBOX_RADIUS = 30;

    const MOVE_SPEED          = 230;
    const MIN_SPEED           = 200;
    const MAX_SPEED           = 250;
    const FRICTION            = 1;
    const COLLISION_BOUNCE    = 1.0;
    const KNOCKBACK_FORCE     = 140;
    const FACE_LOCK_TIME      = 0.5;
    const DAMAGE              = 8;
    const DAMAGE_COOLDOWN     = 0.6;
    const ATTACK_DISPLAY_TIME = 0.15;

    const MAX_HP             = 100;
    const WALK_BOB_AMPLITUDE = 4;
    const WALK_BOB_SPEED     = 10;
    const CLOSE_RANGE        = 100;

    const FIGHTER_A_NAME = 'GREEN ORC';
    const FIGHTER_B_NAME = 'ORANGE ORC';
    // ──────────────────────────────────────────────────────────────────────

    const canvas = document.getElementById('game');
    const ctx    = canvas.getContext('2d');

    const SPRITE_NAMES = {
      left: [
        'orc_left_idle.png', 'orc_left_walk.png', 'orc_left_weapon_ready.png',
        'orc_left_kick_ready.png', 'orc_left_attack_forward.png',
        'orc_left_attack_up.png', 'orc_left_attack_diag_up.png',
        'orc_left_kick_down.png', 'orc_left_kick_diag_down.png'
      ],
      right: [
        'orc_right_idle.png', 'orc_right_walk.png', 'orc_right_weapon_ready.png',
        'orc_right_kick_ready.png', 'orc_right_attack_forward.png',
        'orc_right_attack_up.png', 'orc_right_attack_diag_up.png',
        'orc_right_kick_down.png', 'orc_right_kick_diag_down.png'
      ],
      dead: ['orc_dead.png']
    };

    const SPRITE_PATH = 'assets/sprites/orc/';

    const POSE = {
      idle:           (f) => `orc_${f}_idle.png`,
      walk:           (f) => `orc_${f}_walk.png`,
      weapon_ready:   (f) => `orc_${f}_weapon_ready.png`,
      kick_ready:     (f) => `orc_${f}_kick_ready.png`,
      attack_forward: (f) => `orc_${f}_attack_forward.png`,
      attack_up:      (f) => `orc_${f}_attack_up.png`,
      attack_diag_up: (f) => `orc_${f}_attack_diag_up.png`,
      kick_down:      (f) => `orc_${f}_kick_down.png`,
      kick_diag_down: (f) => `orc_${f}_kick_diag_down.png`,
      dead:           ()  => 'orc_dead.png'
    };

    const images = {};
    const missingSprites = [];

    function loadAllImages() {
      const allNames = [...SPRITE_NAMES.left, ...SPRITE_NAMES.right, ...SPRITE_NAMES.dead];
      let pending = allNames.length;
      function done() {
        pending--;
        if (pending <= 0 && missingSprites.length) {
          console.warn('Missing sprites:', missingSprites);
        }
      }
      for (const name of allNames) {
        const img = new Image();
        img.onload  = done;
        img.onerror = () => { img._failed = true; missingSprites.push(name); done(); };
        img.src = SPRITE_PATH + name;
        images[name] = img;
      }
    }

    function getImage(filename) {
      const img = images[filename];
      if (img && !img._failed && img.complete && img.naturalWidth > 0) return img;
      return null;
    }

    function normalizeSpeed(vx, vy, target) {
      const s = Math.hypot(vx, vy);
      if (s < 1) {
        const a = Math.random() * Math.PI * 2;
        return { vx: Math.cos(a) * target, vy: Math.sin(a) * target };
      }
      const k = target / s;
      return { vx: vx * k, vy: vy * k };
    }

    function facingFromDx(dx) {
      return dx >= 0 ? 'right' : 'left';
    }

    class Orc {
      constructor(x, y, color, enemy) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.enemy = enemy;
        this.hp = MAX_HP;
        this.alive = true;
        this.facing = 'right';
        this.damageCooldown = 0;
        this.faceLockTime = 0;
        this.attackTimer = 0;
        this.attackPose = 'attack_forward';
        this.walkPhase = Math.random() * Math.PI * 2;
      }

      setFacingTowardEnemy() {
        const dx = this.enemy.x - this.x;
        if (Math.abs(dx) > 1) this.facing = facingFromDx(dx);
      }

      giveInitialVelocity() {
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * MOVE_SPEED;
        this.vy = Math.sin(angle) * MOVE_SPEED;
        this.facing = this.vx >= 0 ? 'right' : 'left';
      }

      enforceConstantSpeed() {
        const s = Math.hypot(this.vx, this.vy);
        if (s < MIN_SPEED) {
          const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
          this.vx = n.vx;
          this.vy = n.vy;
          return;
        }
        if (s > MAX_SPEED) {
          const k = MAX_SPEED / s;
          this.vx *= k;
          this.vy *= k;
        }
        const n = normalizeSpeed(this.vx, this.vy, MOVE_SPEED);
        this.vx = n.vx;
        this.vy = n.vy;
      }

      update(dt) {
        if (!this.alive) return;

        this.damageCooldown = Math.max(0, this.damageCooldown - dt);
        this.faceLockTime = Math.max(0, this.faceLockTime - dt);
        if (this.attackTimer > 0) this.attackTimer -= dt;

        if (FRICTION !== 1) {
          const drag = Math.pow(FRICTION, dt * 60);
          this.vx *= drag;
          this.vy *= drag;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        const r = HITBOX_RADIUS;
        const left = ARENA_X + r;
        const right = ARENA_X + ARENA_WIDTH - r;
        const top = ARENA_Y + r;
        const bottom = ARENA_Y + ARENA_HEIGHT - r;

        if (this.x < left)  { this.x = left;  this.vx = -this.vx; }
        if (this.x > right) { this.x = right; this.vx = -this.vx; }
        if (this.y < top)   { this.y = top;   this.vy = -this.vy; }
        if (this.y > bottom){ this.y = bottom;this.vy = -this.vy; }

        this.enforceConstantSpeed();

        if (this.faceLockTime <= 0 && this.attackTimer <= 0) {
          if (Math.abs(this.vx) > 8) {
            this.facing = this.vx > 0 ? 'right' : 'left';
          }
        }

        this.walkPhase += dt * WALK_BOB_SPEED;
      }

      getPose() {
        if (!this.alive) return 'dead';
        if (this.attackTimer > 0) return this.attackPose;

        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const dist = Math.hypot(edx, edy);

        if (dist < CLOSE_RANGE && this.enemy.alive) {
          if (edy > 20 && Math.abs(edx) < edy * 1.2) return 'kick_ready';
          return 'weapon_ready';
        }
        return 'walk';
      }

      getFilename() {
        const pose = this.getPose();
        if (pose === 'dead') return POSE.dead();
        return POSE[pose](this.facing);
      }

      setAttackPoseFromEnemy() {
        const edx = this.enemy.x - this.x;
        const edy = this.enemy.y - this.y;
        const ax = Math.abs(edx);
        const ay = Math.abs(edy);

        if (edy > ay * 0.5 && edy > 10) {
          this.attackPose = ax > ay * 0.6 ? 'kick_diag_down' : 'kick_down';
        } else if (edy < -ay * 0.5 && edy < -10) {
          this.attackPose = ax > ay * 0.6 ? 'attack_diag_up' : 'attack_up';
        } else {
          this.attackPose = 'attack_forward';
        }
        this.attackTimer = ATTACK_DISPLAY_TIME;
      }

      lockFacingOnHit() {
        this.setFacingTowardEnemy();
        this.faceLockTime = FACE_LOCK_TIME;
      }

      takeDamage(amount) {
        if (!this.alive || this.damageCooldown > 0) return false;
        this.hp -= amount;
        this.damageCooldown = DAMAGE_COOLDOWN;
        if (this.hp <= 0) {
          this.hp = 0;
          this.alive = false;
          this.vx = 0;
          this.vy = 0;
        }
        return true;
      }

      draw() {
        const bob = (this.getPose() === 'walk' && this.alive)
          ? Math.sin(this.walkPhase) * WALK_BOB_AMPLITUDE : 0;
        const drawY = this.y + bob;
        const img = getImage(this.getFilename());

        if (img) {
          ctx.drawImage(img, this.x - SPRITE_WIDTH / 2, drawY - SPRITE_HEIGHT / 2, SPRITE_WIDTH, SPRITE_HEIGHT);
        } else {
          ctx.save();
          ctx.fillStyle = this.alive ? this.color : '#555';
          ctx.beginPath();
          ctx.ellipse(this.x, drawY, HITBOX_RADIUS * 0.7, HITBOX_RADIUS, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    function resolveBodyCollision(a, b) {
      if (!a.alive || !b.alive) return;

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minDist = HITBOX_RADIUS * 2;
      if (dist >= minDist || dist === 0) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = minDist - dist;

      a.x -= nx * overlap * 0.5;
      a.y -= ny * overlap * 0.5;
      b.x += nx * overlap * 0.5;
      b.y += ny * overlap * 0.5;

      const relVn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (relVn < 0) {
        const impulse = -relVn * COLLISION_BOUNCE;
        a.vx -= impulse * nx;
        a.vy -= impulse * ny;
        b.vx += impulse * nx;
        b.vy += impulse * ny;
      }

      a.vx -= nx * KNOCKBACK_FORCE;
      a.vy -= ny * KNOCKBACK_FORCE;
      b.vx += nx * KNOCKBACK_FORCE;
      b.vy += ny * KNOCKBACK_FORCE;

      const an = normalizeSpeed(a.vx, a.vy, MOVE_SPEED);
      const bn = normalizeSpeed(b.vx, b.vy, MOVE_SPEED);
      a.vx = an.vx; a.vy = an.vy;
      b.vx = bn.vx; b.vy = bn.vy;

      const aDamaged = a.takeDamage(DAMAGE);
      const bDamaged = b.takeDamage(DAMAGE);
      if (aDamaged || bDamaged) {
        a.lockFacingOnHit();
        b.lockFacingOnHit();
        a.setAttackPoseFromEnemy();
        b.setAttackPoseFromEnemy();
      }
    }

    function drawBottomHPBar(x, y, w, hp, color, label) {
      const h = 28;
      const pct = hp / MAX_HP;
      ctx.fillStyle = '#222';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w * pct, h);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(hp) + ' HP', x + w / 2, y + 19);
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#ccc';
      ctx.fillText('DMG: ' + DAMAGE, x + w / 2, y + h + 18);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#aaa';
      ctx.font = '12px sans-serif';
      ctx.fillText(label, x, y - 6);
    }

    function drawUI() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Title
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ORC BATTLE', CANVAS_WIDTH / 2, 62);

      // Fighter names + VS
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#4caf50';
      ctx.fillText(FIGHTER_A_NAME, 24, 108);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff8c42';
      ctx.fillText(FIGHTER_B_NAME, CANVAS_WIDTH - 24, 108);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('VS', CANVAS_WIDTH / 2, 108);

      // Arena interior
      ctx.fillStyle = '#f0f0ea';
      ctx.fillRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 6;
      ctx.strokeRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 2;
      ctx.strokeRect(ARENA_X + 4, ARENA_Y + 4, ARENA_WIDTH - 8, ARENA_HEIGHT - 8);

      // Bottom HP bars
      const barW = 280;
      const barY = CANVAS_HEIGHT - UI_BOTTOM + 30;
      drawBottomHPBar(24, barY, barW, orcA.hp, '#4caf50', FIGHTER_A_NAME);
      drawBottomHPBar(CANVAS_WIDTH - 24 - barW, barY, barW, orcB.hp, '#ff8c42', FIGHTER_B_NAME);

      // Restart hint
      ctx.fillStyle = '#666';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press R to restart', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 18);
    }

    let orcA, orcB;
    let lastTime = 0;

    function initGame() {
      const midY = ARENA_Y + ARENA_HEIGHT / 2;
      orcA = new Orc(ARENA_X + 95, midY, '#3d8b5e');
      orcB = new Orc(ARENA_X + ARENA_WIDTH - 95, midY, '#c45c26');
      orcA.enemy = orcB;
      orcB.enemy = orcA;
      orcA.giveInitialVelocity();
      orcB.giveInitialVelocity();
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      orcA.update(dt);
      orcB.update(dt);
      resolveBodyCollision(orcA, orcB);

      drawUI();
      orcA.draw();
      orcB.draw();

      if (!orcA.alive || !orcB.alive) {
        const winner = orcA.alive ? FIGHTER_A_NAME + ' WINS!' :
                       orcB.alive ? FIGHTER_B_NAME + ' WINS!' : 'DRAW!';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(ARENA_X, ARENA_Y, ARENA_WIDTH, ARENA_HEIGHT);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(winner, CANVAS_WIDTH / 2, ARENA_Y + ARENA_HEIGHT / 2);
      }

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') initGame();
    });

    loadAllImages();
    initGame();
    requestAnimationFrame((t) => { lastTime = t; gameLoop(t); });
  </script>
</body>
</html>
